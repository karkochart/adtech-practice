; Xdebug 3 для отладки из PhpStorm.
; Сессия стартует только по триггеру (XDEBUG_TRIGGER / кнопка Debug в PhpStorm), поэтому обычный запуск тестов не тормозит.
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=0
xdebug.log=/tmp/xdebug.log
xdebug.log_level=0
